name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/cases.py
      - run: python scripts/demo.py
